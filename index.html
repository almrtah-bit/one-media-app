<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تطبيق إدارة الواجبات</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    
    <!-- ✅ كود تطبيق الثيم فور فتح الصفحة -->
    <script>
        (function() {
            const theme = localStorage.getItem('theme') || 'light';
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    
    <!-- ✅ إضافة Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        
        // 🔑 إعدادات Firebase (One Media)
        const firebaseConfig = {
            apiKey: "AIzaSyAvvOzsLUUN6Lw5xkEguqq-_0m77NdW5gs",
            authDomain: "one-media-f9507.firebaseapp.com",
            databaseURL: "https://one-media-f9507-default-rtdb.firebaseio.com",
            projectId: "one-media-f9507",
            storageBucket: "one-media-f9507.firebasestorage.app",
            messagingSenderId: "177197508158",
            appId: "1:177197508158:web:a795f8e1d952238291936f",
            measurementId: "G-L4T086JLFR"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        // حفظ الإعدادات في window للاستخدام العام
        window.firebaseApp = app;
        window.firebaseDb = db;
        
        console.log('✅ تم تهيئة Firebase بنجاح');
    </script>
    
    <!-- منع الإطار عند النقر -->
    <style>
        *:focus { outline: none !important; box-shadow: none !important; }
    </style>
</head>
<body style="margin: 0; padding-bottom: 100px;">

    <!-- مكان عرض الواجهات المحملة -->
    <div id="main-content-view" style="padding: 15px; margin-top: 10px;"></div>

    <!-- مكان عرض الشريط العلوي (سيكون في الأسفل) -->
    <div id="navbar-container"></div>

    <!-- ملف التحكم الرئيسي -->
    <script type="module" src="app.js"></script>
</body>
</html>
