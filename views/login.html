<link rel="stylesheet" href="assets/css/styles.css">
<div style="max-width: 500px; margin: 50px auto; direction: rtl; text-align: center; font-family: Tahoma, sans-serif;">
    
    <!-- الإطار الأسود الأول -->
    <div style="border: 1px solid #000; border-radius: 12px; padding: 30px; background: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
        
        <!-- العنوان الرئيسي -->
        <h1 style="font-size: 28px; color: #333; margin: 0 0 5px 0; font-weight: 800; letter-spacing: 1px;">
            الإعلام المركزي 📷
        </h1>
        
        <!-- العنوان الفرعي -->
        <p style="font-size: 13px; color: #666; margin: 0 0 25px 0;">
            إدارة واجبات ومهام الإعلام المركزي
        </p>

        <!-- حقل اسم المستخدم (قائمة منسدلة أبجدية) -->
        <div style="margin-bottom: 15px; text-align: right;">
            <label for="loginUsername" style="display: block; margin-bottom: 5px; font-size: 13px; font-weight: 600; color: #333;">اسم المستخدم</label>
            <select id="loginUsername" style="width: 100%; height: 45px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; box-sizing: border-box; background: #f9f9f9;">
                <option value="">اختر اسم المستخدم...</option>
                <!-- سيتم تعبئتها تلقائياً من الكوادر -->
            </select>
        </div>

        <!-- حقل كلمة السر -->
        <div style="margin-bottom: 20px; text-align: right;">
            <label for="loginPassword" style="display: block; margin-bottom: 5px; font-size: 13px; font-weight: 600; color: #333;">كلمة السر</label>
            <input type="password" id="loginPassword" placeholder="••••••••" style="width: 100%; height: 45px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; box-sizing: border-box; background: #f9f9f9;">
        </div>

        <!-- مربع اختيار تذكرني -->
        <div style="display: flex; align-items: center; justify-content: flex-start; margin-bottom: 20px;">
            <label style="display: flex; align-items: center; cursor: pointer; font-size: 13px; color: #333;">
                <input type="checkbox" id="rememberMe" style="margin-left: 8px; width: 16px; height: 16px; cursor: pointer;">
                تذكرني
            </label>
        </div>

        <!-- زر دخول -->
        <button id="loginBtn" style="width: 100%; height: 48px; background: #0066cc; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 600; box-shadow: 0 4px 10px rgba(0, 102, 204, 0.3); transition: all 0.3s ease;">
            🔐 تسجيل الدخول
        </button>
    </div>
</div>

<script>
    (function() {
        // ==================== بيانات الكوادر الافتراضية (تعمل حتى بدون localStorage) ====================
        const DEFAULT_STAFF = [
            { id: 'main-admin', name: 'سجاد مهدي', password: '1234', unit: 'توثيق', role: 'admin', email: 'admin@example.com' }
        ];

        // ==================== دالة جلب الكوادر (مع ضمان وجود البيانات دائماً) ====================
        function getStaff() {
            let staff = JSON.parse(localStorage.getItem('mediaStaff')) || [];
            
            // إذا كانت القائمة فارغة (بعد مسح ذاكرة التخزين)، نضيف البيانات الافتراضية
            if (staff.length === 0) {
                staff = DEFAULT_STAFF;
                localStorage.setItem('mediaStaff', JSON.stringify(staff));
            }
            
            // التأكد من وجود مدير النظام الرئيسي دائماً
            if (!staff.some(s => s.id === 'main-admin')) {
                staff.unshift(DEFAULT_STAFF[0]);
                localStorage.setItem('mediaStaff', JSON.stringify(staff));
            }
            
            return staff;
        }

        // ==================== تعبئة القائمة المنسدلة أبجدياً ====================
        const staffList = getStaff();
        const usernameSelect = document.getElementById('loginUsername');
        
        // ترتيب أبجدي
        staffList.sort((a, b) => a.name.localeCompare(b.name, 'ar'));
        
        staffList.forEach(member => {
            const opt = document.createElement('option');
            opt.value = member.name;
            opt.textContent = member.name;
            usernameSelect.appendChild(opt);
        });

        // ==================== استرجاع بيانات "تذكرني" ====================
        const rememberedUser = localStorage.getItem('rememberedUser');
        const rememberedPass = localStorage.getItem('rememberedPassword');
        
        if (rememberedUser) {
            usernameSelect.value = rememberedUser;
        }
        if (rememberedPass) {
            document.getElementById('loginPassword').value = rememberedPass;
            document.getElementById('rememberMe').checked = true;
        }

        // ==================== زر تسجيل الدخول ====================
        const loginBtn = document.getElementById('loginBtn');
        
        loginBtn.addEventListener('click', async function(e) {
            e.preventDefault();
            
            const selectedUsername = usernameSelect.value;
            const enteredPassword = document.getElementById('loginPassword').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            
            if (!selectedUsername || !enteredPassword) {
                alert('⚠️ يرجى اختيار اسم المستخدم وإدخال كلمة السر.');
                return;
            }
            
            // البحث عن المستخدم في قاعدة بيانات الكوادر
            const user = staffList.find(s => s.name === selectedUsername);
            
            if (!user) {
                alert('⚠️ اسم المستخدم غير موجود.');
                return;
            }
            
            // التحقق من كلمة السر
            if (user.password !== enteredPassword) {
                alert('⚠️ كلمة السر غير صحيحة.');
                return;
            }
            
            // ✅ محاولة تسجيل الدخول عبر Firebase Auth (إذا كان لديه بريد إلكتروني)
            if (user.email && window.firebaseModules) {
                try {
                    const { auth, signInWithEmailAndPassword } = window.firebaseModules;
                    await signInWithEmailAndPassword(auth, user.email, enteredPassword);
                    console.log('✅ تم تسجيل الدخول عبر Firebase Auth');
                } catch (authError) {
                    console.warn('⚠️ تعذر تسجيل الدخول عبر Firebase Auth:', authError.message);
                }
            }
            
            // ✅ تسجيل الدخول بنجاح
            localStorage.setItem('userRole', user.role); // حفظ الصلاحية (admin أو user)
            localStorage.setItem('currentUser', user.name); // حفظ اسم المستخدم الحالي
            localStorage.setItem('currentUserUnit', user.unit); // ✅ حفظ وحدة المستخدم الحالي
            localStorage.setItem('currentUserRole', user.role); // ✅ حفظ صلاحية المستخدم الحالي
            
            // ✅ تسجيل وقت وتاريخ تسجيل الدخول (نظام 12 ساعة)
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? 'مساءً' : 'صباحاً';
            hours = hours % 12;
            hours = hours ? hours : 12;
            const formattedTime = `${hours}:${minutes} ${ampm}`;
            const formattedDate = `${now.getFullYear()}/${now.getMonth() + 1}/${now.getDate()}`;
            localStorage.setItem('loginTime', `${formattedTime} - ${formattedDate}`);
            
            // ✅ حفظ بيانات "تذكرني"
            if (rememberMe) {
                localStorage.setItem('rememberedUser', user.name);
                localStorage.setItem('rememberedPassword', enteredPassword);
            } else {
                localStorage.removeItem('rememberedUser');
                localStorage.removeItem('rememberedPassword');
            }
            
            // ✅ الانتقال إلى الواجهة الرئيسية
            if (window.appInstance && typeof window.appInstance.switchView === 'function') {
                window.appInstance.switchView('home');
            }
        });
    })();
</script>
