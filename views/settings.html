<script>
    (function() {
        const currentUser = localStorage.getItem('currentUser') || 'زائر';
        const userRole = localStorage.getItem('userRole') || 'user';
        const mediaStaff = JSON.parse(localStorage.getItem('mediaStaff')) || [];
        const currentUserData = mediaStaff.find(s => s.name === currentUser);
        const currentUnit = currentUserData ? currentUserData.unit : 'غير محدد';

        document.getElementById('currentSessionInfo').textContent = `${currentUser} (${currentUnit})`;
        document.getElementById('loginTimeInfo').textContent = localStorage.getItem('loginTime') || 'غير مسجل';

        // ✅ تحديث نص زر الثيم عند فتح الصفحة
        updateThemeButton();

        function updateThemeButton() {
            const currentTheme = localStorage.getItem('theme') || 'light';
            const btn = document.getElementById('themeToggleBtn');
            if (currentTheme === 'dark') {
                btn.textContent = '☀️ الوضع النهاري';
            } else {
                btn.textContent = '🌙 الوضع الليلي';
            }
        }

        // ✅ دالة تبديل الثيم الفعلية
        window.toggleTheme = function() {
            const currentTheme = localStorage.getItem('theme') || 'light';
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            
            localStorage.setItem('theme', newTheme);
            
            if (newTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
            
            updateThemeButton();
        };

        // الحماية
        const accessDeniedModal = document.getElementById('accessDeniedModal');
        document.getElementById('closeDeniedBtn').addEventListener('click', function() {
            accessDeniedModal.style.display = 'none';
        });

        window.openMediaStaff = function() {
            if (userRole !== 'admin') { accessDeniedModal.style.display = 'flex'; return; }
            if (window.appInstance && typeof window.appInstance.switchView === 'function') window.appInstance.switchView('media-staff');
        };

        window.openAppSettings = function() {
            if (userRole !== 'admin') { accessDeniedModal.style.display = 'flex'; return; }
            if (window.appInstance && typeof window.appInstance.switchView === 'function') window.appInstance.switchView('app-settings');
        };

        window.showAboutApp = function() {
            document.getElementById('aboutAppModal').style.display = 'flex';
        };

        window.closeAboutApp = function() {
            document.getElementById('aboutAppModal').style.display = 'none';
        };

        const logoutBtn = document.getElementById('logoutBtn');
        if(logoutBtn) {
            logoutBtn.addEventListener('click', function() {
                localStorage.removeItem('currentUser');
                localStorage.removeItem('loginTime');
                if (window.appInstance && typeof window.appInstance.switchView === 'function') window.appInstance.switchView('login');
            });
        }
    })();
</script>
